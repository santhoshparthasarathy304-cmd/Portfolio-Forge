    <article class="iot-document" data-task="task-1">
      <div class="badge-row">
        <span class="badge badge-green">Protosem IoT — Assignment 1</span>

      <h3>Task 1 – ESP32 Web Server LED Control</h3>
      
      <div class="iot-block">
        <h4>1. Project Overview &amp; Objective</h4>
        <p>The primary objective of Assignment 1 was to design and deploy a standalone local IoT web server running entirely on an <strong>ESP32 microcontroller</strong>. The system hosts an interactive, responsive web page that allows any authorized client device connected to the same Wi-Fi network (such as a laptop, tablet, or smartphone) to remotely monitor and control an LED in real time through an HTTP browser interface.</p>
        <p>Unlike cloud-dependent architectures that require third-party brokers or external internet gateways, this implementation operates directly on local area network (LAN) sockets over TCP Port 80, demonstrating core principles of embedded networking and device control.</p>
      </div>

      <div class="iot-block">
        <h4>2. Hardware Components &amp; Specifications</h4>
        <div class="spec-table-wrap">
          <table class="spec-table">
            <thead>
              <tr>
                <th>Component</th>
                <th>Specification / Part</th>
                <th>Quantity</th>

              </tr>
              <tr>
                <td><strong>Breadboard &amp; Jumpers</strong></td>
                <td>Half-size 400-point solderless breadboard + M-to-M wires</td>
                <td>1 set</td>
                <td>Rapid prototyping and circuit interconnection</td>
              </tr>
              <tr>
                <td><strong>USB Cable &amp; Host PC</strong></td>
                <td>Micro-USB data cable (5V / 1A power supply)</td>
                <td>1</td>
                <td>Firmware flashing via Arduino IDE &amp; Serial Monitor debugging</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="iot-block">
        <h4>3. Circuit Design &amp; Pinout Configuration</h4>
        <p>The hardware interface connects an LED to digital output pin <strong>GPIO 2</strong> (which also maps to the onboard LED on most ESP32 DevKit modules). The cathode of the LED is connected to the common Ground (GND) through the 220 &Omega; resistor.</p>
        <div class="diagram-box">
+-----------------------------------------------------------------------+
|                         ESP32 DEVELOPMENT BOARD                       |
|                                                                       |
|   [ GPIO 2 ] ─────────[ 220 &Omega; Resistor ]─────────(+) [ Anode ]       |
|                                                      LED (5mm)        |
|   [  GND   ] <─────────────────────────────────(-) [ Cathode ]     |
|                                                                       |
|   [ Micro-USB ] <══════ 5V DC Power &amp; Serial Communication (PC)      |
+-----------------------------------------------------------------------+
        </div>
        <p><strong>Current Calculation:</strong> With an ESP32 logic HIGH output of 3.3V and an LED forward voltage of 2.0V: <br>
        <code>I = (Vcc - Vf) / R = (3.3V - 2.0V) / 220 &Omega; &approx; 5.9 mA</code>. This safely protects the ESP32 GPIO pin, whose rated maximum current limit is 12-20mA.</p>
      </div>

      <div class="iot-block">
        <h4>4. System Architecture &amp; Communication Flow</h4>
        <p>The end-to-end communication follows a client-server architecture over standard HTTP/1.1:</p>
        <div class="diagram-box">
[ User Device / Browser ]
         │
         │ 1. HTTP GET Request: "GET /LED=ON HTTP/1.1"
         ▼
[ Wi-Fi Router / Local Subnet (2.4 GHz) ]
         │
         │ 2. Delivers packet to Port 80
         ▼
[ ESP32 Web Server (WiFiServer server(80)) ]
         ├──> 3. Reads ASCII header buffer
         ├──> 4. Detects command ("/LED=ON" or "/LED=OFF")
         ├──> 5. Executes digitalWrite(GPIO_2, HIGH / LOW)
         │
         │ 6. Generates HTTP 200 OK + Responsive HTML/CSS UI
         ▼
[ User Device / Browser ]
         │
         └──> 7. Renders refreshed interface displaying updated "LED IS ON" state
        </div>
      </div>

      <div class="iot-block">
        <h4>5. Complete Arduino C++ Source Code</h4>
        <p>The firmware below was developed and compiled in Arduino IDE using the official Espressif ESP32 board package:</p>
        <div class="code-wrapper">
          <div class="code-header">
            <span>ESP32_WebServer_LED_Control.ino</span>
            <span>C++ / Arduino</span>
          </div>
          <pre><code>#include &lt;WiFi.h&gt;

// --- Wi-Fi Network Credentials ---
const char* ssid     = "YOUR_WIFI_SSID";
const char* password = "YOUR_WIFI_PASSWORD";

// --- Hardware Pin Definitions ---
const int ledPin = 2; // Output pin connected to LED (or onboard LED)

// --- Initialize Web Server on Port 80 ---
WiFiServer server(80);

// --- Variable to store incoming HTTP request ---
String header;
String ledState = "off";

// --- Timer for client timeout ---
unsigned long currentTime = millis();
unsigned long previousTime = 0;
const long timeoutTime = 2000;

void setup() {
  Serial.begin(115200);
  pinMode(ledPin, OUTPUT);
  digitalWrite(ledPin, LOW); // Default state: OFF

  // Connect to Local Wi-Fi Network
  Serial.print("Connecting to Wi-Fi network: ");
  Serial.println(ssid);
  WiFi.begin(ssid, password);

  while (WiFi.status() != WL_CONNECTED) {
    delay(500);
    Serial.print(".");
  }

  // Print connection summary to Serial Monitor
  Serial.println("\n--- Wi-Fi Connection Established ---");
  Serial.print("Assigned ESP32 IP Address: http://");
  Serial.println(WiFi.localIP());

  // Start the HTTP server
  server.begin();
  Serial.println("HTTP Web Server successfully started on port 80.");
}

void loop() {
  WiFiClient client = server.available(); // Check for incoming client

  if (client) {
    currentTime = millis();
    previousTime = currentTime;
    Serial.println("\n[Client Connected]");
    String currentLine = "";

    while (client.connected() && currentTime - previousTime <= timeoutTime) {
      currentTime = millis();
      if (client.available()) {
        char c = client.read();
        header += c;

        if (c == '\n') {
          // If the line is empty, two newline characters indicate end of HTTP header
          if (currentLine.length() == 0) {
            // Send standard HTTP response status and headers
            client.println("HTTP/1.1 200 OK");
            client.println("Content-type:text/html");
            client.println("Connection: close");
            client.println();

            // Process user action commands from GET request
            if (header.indexOf("GET /LED=ON") >= 0) {
              Serial.println("Action: Turn LED ON (GPIO 2 -> HIGH)");
              ledState = "on";
              digitalWrite(ledPin, HIGH);
            } else if (header.indexOf("GET /LED=OFF") >= 0) {
              Serial.println("Action: Turn LED OFF (GPIO 2 -> LOW)");
              ledState = "off";
              digitalWrite(ledPin, LOW);
            }

            // Render responsive HTML/CSS web interface
            client.println("&lt;!DOCTYPE html&gt;&lt;html lang='en'&gt;");
            client.println("&lt;head&gt;&lt;meta name='viewport' content='width=device-width, initial-scale=1'&gt;");
            client.println("&lt;title&gt;ESP32 Web Server Control&lt;/title&gt;");
            client.println("&lt;style&gt;");
            client.println("body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f7f5ef; color: #202522; text-align: center; margin: 0; padding: 40px 16px; }");
            client.println(".card { background: #ffffff; max-width: 440px; margin: 0 auto; padding: 32px 24px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); border: 1px solid #dfe3db; }");
            client.println("h2 { margin: 0 0 10px; color: #1e6b52; font-size: 26px; }");
            client.println("p { color: #68716c; font-size: 15px; margin-bottom: 24px; }");
            client.println(".status { display: inline-block; padding: 6px 14px; border-radius: 999px; font-weight: 700; font-size: 13px; text-transform: uppercase; margin-bottom: 24px; }");
            client.println(".status-on { background: #e6f3ee; color: #1e6b52; }");
            client.println(".status-off { background: #fdf0e9; color: #e47e43; }");
            client.println(".btn { display: block; width: 100%; max-width: 240px; margin: 10px auto; padding: 14px 20px; font-size: 16px; font-weight: 700; text-decoration: none; border-radius: 8px; transition: .2s; }");
            client.println(".btn-on { background: #1e6b52; color: #ffffff; }");
            client.println(".btn-off { background: #e47e43; color: #ffffff; }");
            client.println("&lt;/style&gt;&lt;/head&gt;");
            client.println("&lt;body&gt;");
            client.println("&lt;div class='card'&gt;");
            client.println("&lt;h2&gt;ESP32 LED Web Server&lt;/h2&gt;");
            client.println("&lt;p&gt;Protosem Assignment 1 Local Control&lt;/p&gt;");
            if (ledState == "on") {
              client.println("&lt;div class='status status-on'&gt;Current State: LED is ON&lt;/div&gt;");
              client.println("&lt;a href='/LED=OFF' class='btn btn-off'&gt;TURN OFF&lt;/a&gt;");
            } else {
              client.println("&lt;div class='status status-off'&gt;Current State: LED is OFF&lt;/div&gt;");
              client.println("&lt;a href='/LED=ON' class='btn btn-on'&gt;TURN ON&lt;/a&gt;");
            }
            client.println("&lt;/div&gt;&lt;/body&gt;&lt;/html&gt;");
            client.println();
            break;
          } else {
            currentLine = "";
          }
        } else if (c != '\r') {
          currentLine += c;
        }
      }
    }
    // Clear header string for the next transaction
    header = "";
    // Terminate socket connection
    client.stop();
    Serial.println("[Client Disconnected]");
  }
}</code></pre>

          <li><strong>Hardware Protection:</strong> Sized current-limiting resistors accurately based on forward diode voltage drop and microcontroller pin drive limits.</li>

#include "Adafruit_MQTT.h"

// 2. HARDWARE PIN DEFINITION

const int LED_PIN = 2; // Output pin: GPIO 2 (onboard LED or relay trigger)

// ====================================================================
WiFiClient client;
Adafruit_MQTT_Client mqtt(&amp;client, AIO_SERVER, AIO_SERVERPORT, AIO_USERNAME, AIO_KEY);

// Setup MQTT subscription for the feed: &lt;username&gt;/feeds/led
Adafruit_MQTT_Subscribe ledFeed = Adafruit_MQTT_Subscribe(&amp;mqtt, AIO_USERNAME "/feeds/led");

// Function prototype for auto-reconnection
void MQTT_connect();

// ====================================================================
// 4. SETUP ROUTINE
// ====================================================================
void setup() {
  Serial.begin(115200);
  delay(10);

  pinMode(LED_PIN, OUTPUT);

  Serial.println("\n--- ESP32 + Adafruit IO Cloud LED Control Initializing ---");

  Serial.println(WLAN_SSID);
  WiFi.begin(WLAN_SSID, WLAN_PASS);

  while (WiFi.status() != WL_CONNECTED) {

    Serial.print(".");
  }

  Serial.println("\nWiFi Connected successfully!");
  Serial.print("Assigned IP Address: ");
  Serial.println(WiFi.localIP());

  // Register MQTT Subscriptions
  mqtt.subscribe(&amp;ledFeed);
  Serial.println("Subscribed to MQTT Feed: " AIO_USERNAME "/feeds/led");
}

// ====================================================================
// 5. MAIN EXECUTION LOOP
// ====================================================================
void loop() {
  // Ensure the MQTT connection to broker remains active
  MQTT_connect();

  // Read subscription packets with a 5000ms non-blocking timeout
  Adafruit_MQTT_Subscribe *subscription;
  while ((subscription = mqtt.readSubscription(5000))) {
    if (subscription == &amp;ledFeed) {
      char *payload = (char *)ledFeed.lastread;
      Serial.print("\n[MQTT Update] Received on feed 'led': ");
      Serial.println(payload);

      // Evaluate received payload command
      if (strcasecmp(payload, "ON") == 0 || strcmp(payload, "1") == 0) {
        digitalWrite(LED_PIN, HIGH);
        Serial.println("-> Action: LED / Relay switched ON (GPIO 2 HIGH)");
      } else if (strcasecmp(payload, "OFF") == 0 || strcmp(payload, "0") == 0) {

        Serial.println("-> Action: LED / Relay switched OFF (GPIO 2 LOW)");
      } else {
        Serial.print("-> Warning: Unrecognized payload: ");
        Serial.println(payload);
      }
    }
  }

  // Ping the broker every 60s to maintain socket keep-alive
  if (!mqtt.ping()) {
    mqtt.disconnect();
  }
}

// ====================================================================
// 6. ROBUST MQTT AUTO-RECONNECT LOGIC
// ====================================================================
void MQTT_connect() {
  int8_t ret;

  // Stop if already connected
  if (mqtt.connected()) {
    return;
  }

  Serial.print("Connecting to Adafruit IO MQTT Broker... ");

  uint8_t retries = 3;
  while ((ret = mqtt.connect()) != 0) { // connect returns 0 on success
    Serial.println(mqtt.connectErrorString(ret));
    Serial.println("Retrying MQTT connection in 5 seconds...");
    mqtt.disconnect();
    delay(5000); // Wait 5 seconds before retrying
    retries--;
    if (retries == 0) {
      Serial.println("Failed to connect after 3 attempts. Resetting wait cycle...");

    }
  }

      <div class="iot-block">

        <div class="diagram-box">
+─────────────────────────────────────────────+       +─────────────────────────────────────────────+
|               "THIS" (Trigger)              |       |               "THAT" (Action)               |
|                                             |       |                                             |
| Service: Google Assistant (Voice AI)        | ────> | Service: Adafruit IO (IoT Cloud Broker)     |

        <p>Switching 230V AC mains requires strict galvanic isolation to prevent high-voltage transients from destroying the 3.3V ESP32 microcontroller or posing an electrical shock hazard. An <strong>optocoupled relay module</strong> isolates the control side from the load side using an internal infrared LED and phototransistor.</p>

             +-----------------------+         +-------------------------------------+

#include "Adafruit_MQTT.h"
#include "Adafruit_MQTT_Client.h"

// ====================================================================
// 1. NETWORK &amp; CLOUD BROKER CREDENTIALS (MASKED FOR SECURITY)
// ====================================================================
#define WLAN_SSID       "YOUR_WIFI_SSID"          // 2.4 GHz Wi-Fi SSID
#define WLAN_PASS       "YOUR_WIFI_PASSWORD"      // Wi-Fi Password

#define AIO_SERVER      "io.adafruit.com"         // Adafruit IO Broker Host

// ====================================================================
// 2. HARDWARE RELAY CONFIGURATION (ACTIVE-LOW LOGIC)
// ====================================================================
const int RELAY_PIN = 4; // GPIO 4 connected to Relay IN terminal

#define RELAY_ON  LOW   // Active-LOW trigger logic
#define RELAY_OFF HIGH  // Active-LOW cutoff logic

// ====================================================================
// 3. MQTT CLIENT &amp; FEED SUBSCRIPTION
// ====================================================================
WiFiClient client;
Adafruit_MQTT_Client mqtt(&amp;client, AIO_SERVER, AIO_SERVERPORT, AIO_USERNAME, AIO_KEY);

// Setup subscription for the voice automation feed: &lt;username&gt;/feeds/bulb
Adafruit_MQTT_Subscribe voiceFeed = Adafruit_MQTT_Subscribe(&amp;mqtt, AIO_USERNAME "/feeds/bulb");

// Function prototype for auto-reconnection
void MQTT_connect();

// ====================================================================
// 4. SETUP ROUTINE
// ====================================================================
void setup() {
  Serial.begin(115200);
  delay(10);

  // Initialize Relay GPIO as output and default to OFF state
  pinMode(RELAY_PIN, OUTPUT);
  digitalWrite(RELAY_PIN, RELAY_OFF);

  Serial.println("
--- ESP32 Voice Automation (IFTTT + Adafruit IO) Booting ---");

  // Connect to Local Wi-Fi Network
  Serial.print("Connecting to Wi-Fi: ");
  Serial.println(WLAN_SSID);
  WiFi.begin(WLAN_SSID, WLAN_PASS);

  while (WiFi.status() != WL_CONNECTED) {
    delay(500);
    Serial.print(".");
  }

  Serial.println("
WiFi Connected successfully!");
  Serial.print("Assigned IP Address: ");
  Serial.println(WiFi.localIP());

  // Subscribe to Adafruit IO Feed updated by IFTTT Applet
  mqtt.subscribe(&amp;voiceFeed);
  Serial.println("Subscribed to Voice Feed: " AIO_USERNAME "/feeds/bulb");
}

// ====================================================================
// 5. MAIN EXECUTION LOOP
// ====================================================================
void loop() {
  // Ensure MQTT connection to broker is alive
  MQTT_connect();

  // Read incoming subscription packets with a 5000ms non-blocking window
  Adafruit_MQTT_Subscribe *subscription;
  while ((subscription = mqtt.readSubscription(5000))) {
    if (subscription == &amp;voiceFeed) {
      char *payload = (char *)voiceFeed.lastread;
      Serial.print("
[Voice Automation Event] Feed 'bulb' payload: ");
      Serial.println(payload);

      // Evaluate command published by IFTTT Applet
      if (strcasecmp(payload, "ON") == 0 || strcmp(payload, "1") == 0) {
        digitalWrite(RELAY_PIN, RELAY_ON);
        Serial.println("-> Action: Relay CLOSED -> AC Bulb turned ON");
      } else if (strcasecmp(payload, "OFF") == 0 || strcmp(payload, "0") == 0) {
        digitalWrite(RELAY_PIN, RELAY_OFF);
        Serial.println("-> Action: Relay OPENED -> AC Bulb turned OFF");
      } else {
        Serial.print("-> Warning: Unhandled voice payload: ");
        Serial.println(payload);
      }
    }
  }

  // Ping Adafruit IO broker every 60 seconds to keep connection active
  if (!mqtt.ping()) {
    mqtt.disconnect();
  }
}

// ====================================================================
// 6. ROBUST AUTO-RECONNECTION LOGIC
// ====================================================================
void MQTT_connect() {
  int8_t ret;

  if (mqtt.connected()) {
    return;
  }

  Serial.print("Connecting to Adafruit IO Cloud Broker... ");

  uint8_t retries = 3;
  while ((ret = mqtt.connect()) != 0) {
    Serial.println(mqtt.connectErrorString(ret));
    Serial.println("Retrying in 5 seconds...");
    mqtt.disconnect();
    delay(5000);
    retries--;
    if (retries == 0) {
      Serial.println("Connection attempts failed. Resetting loop...");
      return;
    }
  }

  Serial.println("Connected to Adafruit IO!");
}</code></pre>

            <p><strong>Problem:</strong> Saying "turn on" turned the bulb OFF, and saying "turn off" turned it ON.<br>
            <strong>Root Cause:</strong> The optocoupler on the Songle relay module uses active-LOW triggering, whereas standard digital logic assumes active-HIGH.<br>

#include &lt;FirebaseESP32.h&gt;
#include &lt;DHT.h&gt;

// 1. WI-FI &amp; FIREBASE CREDENTIALS (MASKED FOR SECURITY)
// ====================================================================
#define WIFI_SSID       "YOUR_WIFI_SSID"
#define WIFI_PASSWORD   "YOUR_WIFI_PASSWORD"

#define FIREBASE_HOST   "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com/"
#define FIREBASE_AUTH   "YOUR_FIREBASE_DATABASE_SECRET_OR_WEB_API_KEY"

// ====================================================================

// ====================================================================
#define DHTPIN          15        // GPIO 15 connected to DHT11 Data pin
#define DHTTYPE         DHT11     // DHT 11 sensor model
#define LDRPIN          34        // GPIO 34 (ADC1 Channel 6) connected to LDR analog output

DHT dht(DHTPIN, DHTTYPE);

// Firebase objects
FirebaseData fbdo;
FirebaseAuth auth;
FirebaseConfig config;

// Timing variables
unsigned long previousMillis = 0;
const long interval = 5000; // Push sensor telemetry every 5 seconds

// ====================================================================
// 3. SETUP ROUTINE
// ====================================================================
void setup() {
  Serial.begin(115200);
  delay(10);

  dht.begin();
  pinMode(LDRPIN, INPUT);

  Serial.println("
--- ESP32 + Firebase Realtime DB Monitoring System Boot ---");

  // Connect to Local Wi-Fi
  Serial.print("Connecting to Wi-Fi: ");
  Serial.println(WIFI_SSID);
  WiFi.begin(WIFI_SSID, WIFI_PASSWORD);

  while (WiFi.status() != WL_CONNECTED) {
    delay(500);
    Serial.print(".");
  }

  Serial.println("
WiFi Connected successfully!");
  Serial.print("Assigned IP Address: ");
  Serial.println(WiFi.localIP());

  // Configure Firebase Client
  config.host = FIREBASE_HOST;
  config.signer.tokens.legacy_token = FIREBASE_AUTH;

  Firebase.begin(&amp;config, &amp;auth);
  Firebase.reconnectWiFi(true);

  // Set timeout and buffer sizes
  fbdo.setBSSLBufferSize(1024, 1024);
  fbdo.setResponseSize(1024);

  Serial.println("Firebase Client Connected and Initialized.");
}

// ====================================================================
// 4. MAIN LOOP
// ====================================================================
void loop() {
  unsigned long currentMillis = millis();

  if (currentMillis - previousMillis &gt;= interval) {
    previousMillis = currentMillis;

    // Read Sensor Values
    float humidity = dht.readHumidity();
    float temperature = dht.readTemperature(); // Celsius
    int ldrValue = analogRead(LDRPIN);         // 0 to 4095

    // Check for sensor read failure
    if (isnan(humidity) || isnan(temperature)) {
      Serial.println("Error: Failed to read from DHT11 sensor! Skipping cycle.");
      return;
    }

    Serial.println("
--- Sensor Telemetry Sample ---");
    Serial.printf("Temperature: %.1f °C | Humidity: %.1f %% | Light (LDR): %d
", temperature, humidity, ldrValue);

    // Push data to Firebase Realtime Database node: /environment
    if (Firebase.setFloat(fbdo, "/environment/temperature", temperature)) {
      Serial.println("-&gt; Uploaded: /environment/temperature");
    } else {
      Serial.printf("-&gt; Failed to set Temperature: %s
", fbdo.errorReason().c_str());
    }

    if (Firebase.setFloat(fbdo, "/environment/humidity", humidity)) {
      Serial.println("-&gt; Uploaded: /environment/humidity");
    } else {
      Serial.printf("-&gt; Failed to set Humidity: %s
", fbdo.errorReason().c_str());
    }

    if (Firebase.setInt(fbdo, "/environment/light", ldrValue)) {
      Serial.println("-&gt; Uploaded: /environment/light");
    } else {
      Serial.printf("-&gt; Failed to set Light: %s
", fbdo.errorReason().c_str());
    }
  }

      <!-- Section 2: Hybrid Operation Modes -->
      <div class="iot-block">
        <h4>2. Hybrid Operation Modes: Autonomous Sensing vs. Cloud Manual Override</h4>
        <p>
          A central limitation of many basic IoT systems is rigid single-mode operation: they either operate purely autonomously (preventing human intervention) or rely entirely on remote buttons (failing if an operator is absent). Our architecture introduces a dual-state <strong>Hybrid Control State Machine</strong> that seamlessly transitions between autonomous edge control and cloud manual intervention:
        </p>

        <div class="grid-2" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin:16px 0;">
          <div class="tech-card" style="border-left:4px solid var(--accent-green);background:rgba(46,164,79,0.05);padding:16px;border-radius:8px;">
            <h5 style="color:var(--accent-green);margin-bottom:8px;font-weight:700;">🟢 Mode A: Automatic Edge Automation (AUTO)</h5>
            <ul style="padding-left:18px;font-size:13.5px;line-height:1.6;">
              <li><strong>Trigger Condition:</strong> Evaluates ambient light <code>analogRead(LDRPIN)</code> against the cloud-calibrated <code>lightThreshold</code> stored at <code>/controls/threshold</code>.</li>
              <li><strong>Darkness Threshold:</strong> When ambient light drops below threshold (e.g. <code>LDR &lt; 1000</code>), firmware asserts active-LOW on GPIO 4, closing the relay contacts to illuminate the bulb.</li>
              <li><strong>Daylight Restoration:</strong> When ambient light rises above the threshold (plus a software hysteresis deadband of +50 units), the relay opens to de-energize the bulb, conserving energy.</li>
              <li><strong>Edge Reliability:</strong> Decision logic executes locally on the ESP32 core; if cloud connectivity fluctuates, local automated switching continues uninterrupted.</li>
            </ul>
          </div>

          <div class="tech-card" style="border-left:4px solid var(--accent-orange);background:rgba(217,119,6,0.05);padding:16px;border-radius:8px;">
            <h5 style="color:var(--accent-orange);margin-bottom:8px;font-weight:700;">🟠 Mode B: Cloud Manual Override (MANUAL)</h5>
            <ul style="padding-left:18px;font-size:13.5px;line-height:1.6;">
              <li><strong>User Control:</strong> Operator clicks the "MANUAL MODE" button on the dashboard, switching <code>/controls/mode</code> to <code>"MANUAL"</code>.</li>
              <li><strong>Sensor Decoupling:</strong> The ESP32 bypasses the LDR comparator logic and directly listens to <code>/controls/appliance</code>.</li>
              <li><strong>Instant Switching:</strong> Clicking "TURN ON" or "TURN OFF" on the web UI publishes a boolean command via Firebase WebSocket streams. The ESP32 immediately actuates the relay.</li>
              <li><strong>Override Safety:</strong> Useful for maintenance, emergency illumination, or testing regardless of ambient optical conditions.</li>
            </ul>
          </div>
        </div>

        <p>
          The system maintains state coherence by writing the physical status of the relay back to <code>/environment/relayState</code> in both modes, ensuring that dashboard users always view verified physical feedback rather than unconfirmed software assumptions.
        </p>
      </div>

      <!-- Section 3: LDR Calibration & Threshold Logic -->
      <div class="iot-block">
        <h4>3. LDR Sensor Calibration, ADC Quantization & Threshold Switching Logic</h4>
        <p>
          Ambient light quantification is performed using a photoresistor (LDR) arranged in a voltage divider circuit with a 10 kΩ pull-down resistor connected to ESP32 ADC1 Channel 6 (GPIO 34):
        </p>
        <div class="tech-card" style="margin:12px 0;">
          <p style="font-size:13.5px;margin-bottom:8px;"><strong>Voltage Divider Transfer Function:</strong></p>
          <code style="font-size:14px;color:var(--accent-blue);font-weight:bold;">V_out = V_in × [ R_fixed / (R_LDR + R_fixed) ]</code>
          <p style="font-size:13px;color:#718096;margin-top:6px;">
            Where <code>V_in = 3.3V</code> and <code>R_fixed = 10,000 Ω</code>. In bright light, LDR resistance drops to ~1 kΩ, driving <code>V_out ≈ 3.0V</code> (ADC raw counts ~3700). In total darkness, LDR resistance surges past 100 kΩ, causing <code>V_out ≈ 0.3V</code> (ADC raw counts &lt; 400).
          </p>
        </div>

        <table style="width:100%;border-collapse:collapse;margin-top:14px;font-size:13px;">
          <thead>
            <tr style="background:rgba(255,255,255,0.05);text-align:left;">
              <th style="padding:10px;border:1px solid var(--border-color);">Environmental Condition</th>
              <th style="padding:10px;border:1px solid var(--border-color);">LDR Resistance</th>
              <th style="padding:10px;border:1px solid var(--border-color);">ESP32 ADC Value (12-bit)</th>
              <th style="padding:10px;border:1px solid var(--border-color);">Auto Relay Action</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td style="padding:10px;border:1px solid var(--border-color);">Direct Overhead Light / Flashlight</td>
              <td style="padding:10px;border:1px solid var(--border-color);">&lt; 1 kΩ</td>
              <td style="padding:10px;border:1px solid var(--border-color);">&gt; 3500</td>
              <td style="padding:10px;border:1px solid var(--border-color);color:#e53e3e;font-weight:bold;">Bulb OFF</td>
            </tr>
            <tr>
              <td style="padding:10px;border:1px solid var(--border-color);">Standard Ambient Lab Lighting</td>
              <td style="padding:10px;border:1px solid var(--border-color);">3 kΩ – 7 kΩ</td>
              <td style="padding:10px;border:1px solid var(--border-color);">1800 – 2600</td>
              <td style="padding:10px;border:1px solid var(--border-color);color:#e53e3e;font-weight:bold;">Bulb OFF</td>
            </tr>
            <tr>
              <td style="padding:10px;border:1px solid var(--border-color);">Cloud-Calibrated Setpoint (Threshold)</td>
              <td style="padding:10px;border:1px solid var(--border-color);">~ 10 kΩ</td>
              <td style="padding:10px;border:1px solid var(--border-color);"><strong>1000 (Adjustable 100-3000)</strong></td>
              <td style="padding:10px;border:1px solid var(--border-color);color:var(--accent-orange);font-weight:bold;">Switching Boundary</td>
            </tr>
            <tr>
              <td style="padding:10px;border:1px solid var(--border-color);">Covered / Shaded / Night Simulation</td>
              <td style="padding:10px;border:1px solid var(--border-color);">&gt; 25 kΩ</td>
              <td style="padding:10px;border:1px solid var(--border-color);">&lt; 900</td>
              <td style="padding:10px;border:1px solid var(--border-color);color:#38a169;font-weight:bold;">Bulb ON (Auto-Lit)</td>
            </tr>
          </tbody>
        </table>

        <!-- Software Hysteresis Graph / Logic -->
        <div class="tech-card" style="margin-top:14px;">
          <h5 style="color:var(--accent-orange);margin-bottom:8px;font-weight:700;">Hysteresis Deadband Implementation to Eliminate Relay Chattering</h5>
          <p style="font-size:13.5px;">
            Near the optical switching threshold (e.g., during dawn or twilight transitions), small noise fluctuations in the ADC read cycle can cause rapid, destructive clicking of the mechanical relay ("relay chattering"). We implemented a software hysteresis deadband:
          </p>
          <pre style="background:#0d1117;color:#c9d1d9;padding:12px;border-radius:6px;font-size:13px;line-height:1.4;">
const int HYSTERESIS = 50; // Deadband margin

if (ldrValue &lt; (lightThreshold - HYSTERESIS)) {
    // Definitive darkness: energize relay (active-LOW)
    digitalWrite(RELAY_PIN, RELAY_ON);
    currentRelayState = true;
} else if (ldrValue &gt; (lightThreshold + HYSTERESIS)) {
    // Definitive daylight: de-energize relay
    digitalWrite(RELAY_PIN, RELAY_OFF);
    currentRelayState = false;
}
// Inside [Threshold - 50, Threshold + 50], previous relay state is preserved!</pre>
        </div>
      </div>

      <div class="iot-block">
        <h4>5. Client-Side Historical Telemetry Data Export (CSV) Workflow</h4>
        <p>
          An essential requirement of industrial IoT monitoring is exporting archival telemetry for statistical analysis, environmental auditing, and predictive maintenance. Rather than requiring heavy server-side scripts or paid database plugins, our dashboard executes an entirely client-side, zero-dependency <strong>RFC 4180 Compliant CSV Export Engine</strong>:
        </p>

        <div class="tech-card" style="margin-top:12px;">
          <h5 style="color:var(--accent-green);margin-bottom:8px;font-weight:700;">Five-Step Client-Side CSV Generation Pipeline</h5>
          <ol style="padding-left:20px;font-size:13.5px;line-height:1.6;">
            <li><strong>Firebase Query:</strong> When the user clicks "📥 Export Telemetry to CSV", JavaScript invokes <code>database.ref('/history').once('value')</code> to retrieve the historical records snapshot.</li>
            <li><strong>Key & Header Normalization:</strong> The engine defines explicit CSV header columns: <code>"Record_ID,Timestamp_Sec,Date_Time_ISO,Temperature_C,Humidity_Pct,Light_ADC,Relay_Status,Operating_Mode"</code>.</li>
            <li><strong>Data Parsing & Row Serialization:</strong> Iterating through each child record via <code>snapshot.forEach()</code>, the engine converts relative timestamps into readable ISO 8601 strings and serializes values with comma delimiters.</li>
            <li><strong>MIME Blob Construction:</strong> The serialized string is converted into an in-memory binary blob: <code>new Blob([csvContent], { type: 'text/csv;charset=utf-8;' })</code>.</li>
            <li><strong>Automated Anchor Download:</strong> A temporary DOM link is instantiated with <code>URL.createObjectURL(blob)</code>, assigned a dynamic filename (e.g. <code>iot_telemetry_2026-11-14.csv</code>), clicked programmatically, and revoked to prevent memory leaks.</li>
          </ol>
        </div>
      </div>

        <p>

        </p>

        <div class="code-container" style="margin-top:14px;">
          <div class="code-header">
            <span>ESP32_Firebase_Automation_Logging.ino</span>
            <a href="iot/ESP32_Firebase_Automation_Logging/ESP32_Firebase_Automation_Logging.ino" download class="btn-copy">Download Code</a>
          </div>
          <pre style="background:#0d1117;color:#c9d1d9;padding:16px;border-radius:0 0 8px 8px;font-size:12.5px;line-height:1.5;overflow-x:auto;"><code>/*
 * ==================================================================================
 * Assignment 5 – Firebase Logging, Hybrid Automation & Data Export
 * Protosem IoT Seminar Track
 * Author: Santhosh P (Mechatronics Engineering)
 * Platform: ESP32 Dev Module (ESP-WROOM-32)
 * Actuators: 5V Relay Module (Active-LOW on GPIO 4)
 * Sensors: DHT11 (GPIO 15), LDR Analog Sensor (ADC1 GPIO 34)
 * Framework: Arduino IDE
 * Libraries: WiFi.h, FirebaseESP32.h, DHT.h
 * ==================================================================================
 */

#include &lt;WiFi.h&gt;
#include &lt;FirebaseESP32.h&gt;
#include &lt;DHT.h&gt;

// ==================================================================================
// 1. NETWORK &amp; FIREBASE CONFIGURATION (MASKED FOR SECURITY)
// ==================================================================================
#define WIFI_SSID       "YOUR_WIFI_SSID"
#define WIFI_PASSWORD   "YOUR_WIFI_PASSWORD"

#define FIREBASE_HOST   "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com/"
#define FIREBASE_AUTH   "YOUR_FIREBASE_DATABASE_SECRET_OR_WEB_API_KEY"

// ==================================================================================
// 2. HARDWARE PIN DEFINITIONS
// ==================================================================================
#define DHTPIN          15        // DHT11 Data Line
#define DHTTYPE         DHT11     // DHT11 Sensor
#define LDRPIN          34        // LDR on ADC1 Channel 6
#define RELAY_PIN       4         // Relay Module Input Pin

#define RELAY_ON        LOW       // Active-LOW trigger
#define RELAY_OFF       HIGH      // Active-LOW cutoff

DHT dht(DHTPIN, DHTTYPE);

FirebaseData fbdo;
FirebaseAuth auth;
FirebaseConfig config;

// Timing intervals
unsigned long prevSensorMillis = 0;
const long sensorInterval = 5000; // 5-second sensor telemetry cycle

unsigned long prevLogMillis = 0;
const long logInterval = 15000;   // 15-second historical database log cycle

// Operating parameters
String currentMode = "AUTO";      // "MANUAL" or "AUTO"
int lightThreshold = 1000;        // LDR threshold (0-4095)
bool manualRelayCmd = false;      // Manual override command
bool currentRelayState = false;   // Physical state of relay

// ==================================================================================
// 3. SETUP ROUTINE
// ==================================================================================
void setup() {
  Serial.begin(115200);
  delay(10);

  pinMode(RELAY_PIN, OUTPUT);
  digitalWrite(RELAY_PIN, RELAY_OFF);
  pinMode(LDRPIN, INPUT);
  dht.begin();

  Serial.println("\n=======================================================");
  Serial.println("  ESP32 Firebase Logging &amp; Automation Initializing     ");
  Serial.println("=======================================================");

  // Connect to Wi-Fi
  Serial.print("Connecting to Wi-Fi: ");
  Serial.println(WIFI_SSID);
  WiFi.begin(WIFI_SSID, WIFI_PASSWORD);
  while (WiFi.status() != WL_CONNECTED) {
    delay(500);
    Serial.print(".");
  }

  Serial.println("\nWiFi Connected!");
  Serial.print("Assigned IP: ");
  Serial.println(WiFi.localIP());

  // Firebase Initialization
  config.host = FIREBASE_HOST;
  config.signer.tokens.legacy_token = FIREBASE_AUTH;
  Firebase.begin(&amp;config, &amp;auth);
  Firebase.reconnectWiFi(true);

  fbdo.setBSSLBufferSize(1024, 1024);
  fbdo.setResponseSize(1024);

  // Initial read of cloud control settings
  if (Firebase.getString(fbdo, "/controls/mode")) {
    currentMode = fbdo.stringData();
    Serial.println("Initial Mode from Cloud: " + currentMode);
  }
  if (Firebase.getInt(fbdo, "/controls/threshold")) {
    lightThreshold = fbdo.intData();
    Serial.printf("Initial LDR Threshold: %d\n", lightThreshold);
  }

  Serial.println("System Ready. Entering Main Automation Loop...");
}

// ==================================================================================
// 4. MAIN LOOP
// ==================================================================================
void loop() {
  unsigned long currentMillis = millis();

  // Read latest mode and threshold settings from Firebase
  if (Firebase.getString(fbdo, "/controls/mode")) {
    currentMode = fbdo.stringData();
  }
  if (Firebase.getInt(fbdo, "/controls/threshold")) {
    lightThreshold = fbdo.intData();
  }

  // Sample Sensors &amp; Execute Automation Logic
  if (currentMillis - prevSensorMillis &gt;= sensorInterval) {
    prevSensorMillis = currentMillis;

    float h = dht.readHumidity();
    float t = dht.readTemperature();
    int ldr = analogRead(LDRPIN);

    if (isnan(h) || isnan(t)) {
      Serial.println("Warning: DHT11 read failure! Skipping telemetry cycle.");
      return;
    }

    // --- HYBRID AUTOMATION LOGIC ---
    if (currentMode.equalsIgnoreCase("AUTO")) {
      // Automatic Mode: LDR Threshold Comparison
      // If ambient light drops below threshold, turn bulb ON
      if (ldr &lt; lightThreshold) {
        digitalWrite(RELAY_PIN, RELAY_ON);
        currentRelayState = true;
      } else {
        digitalWrite(RELAY_PIN, RELAY_OFF);
        currentRelayState = false;
      }
      Serial.printf("[AUTO MODE] LDR: %d | Threshold: %d -&gt; Bulb: %s\n",
                    ldr, lightThreshold, currentRelayState ? "ON" : "OFF");
    } else {
      // Manual Mode: Follow dashboard toggle switch command
      if (Firebase.getBool(fbdo, "/controls/appliance")) {
        manualRelayCmd = fbdo.boolData();
      }
      if (manualRelayCmd) {
        digitalWrite(RELAY_PIN, RELAY_ON);
        currentRelayState = true;
      } else {
        digitalWrite(RELAY_PIN, RELAY_OFF);
        currentRelayState = false;
      }
      Serial.printf("[MANUAL MODE] Dashboard Command -&gt; Bulb: %s\n",
                    currentRelayState ? "ON" : "OFF");
    }

    // Update Live Telemetry in Firebase
    Firebase.setFloat(fbdo, "/environment/temperature", t);
    Firebase.setFloat(fbdo, "/environment/humidity", h);
    Firebase.setInt(fbdo, "/environment/light", ldr);
    Firebase.setBool(fbdo, "/environment/relayState", currentRelayState);
  }

  // --- HISTORICAL LOGGING &amp; TIME-SERIES ARCHIVE ---
  if (currentMillis - prevLogMillis &gt;= logInterval) {
    prevLogMillis = currentMillis;

    float t = dht.readTemperature();
    float h = dht.readHumidity();
    int ldr = analogRead(LDRPIN);

    if (!isnan(t) &amp;&amp; !isnan(h)) {
      FirebaseJson json;
      json.set("temperature", t);
      json.set("humidity", h);
      json.set("light", ldr);
      json.set("relay", currentRelayState);
      json.set("mode", currentMode);
      json.set("timestamp", (int)(currentMillis / 1000));

      // Push historical record to Firebase path: /history
      if (Firebase.pushJSON(fbdo, "/history", json)) {
        Serial.println("-&gt; Historical log record successfully appended to /history");
      }
    }
  }
}</code></pre>

      <!-- Section 11: Problems Encountered & Engineering Solutions -->
      <div class="iot-block">
        <h4>11. Actual Technical Problems Encountered & Engineering Solutions</h4>
        <div class="troubleshooting-grid" style="display:grid;grid-template-columns:1fr;gap:14px;margin-top:14px;">
          <div class="tech-card" style="border-left:4px solid #e53e3e;">
            <h5 style="color:#e53e3e;font-weight:700;">Issue 1: Relay Chattering Around Ambient Light Threshold</h5>
            <p style="font-size:13.5px;margin:6px 0;"><strong>Symptom:</strong> When room lighting hovered exactly around the threshold value, the relay rapidly switched ON and OFF (chattering), producing acoustic buzzing and risking mechanical contact welding.</p>
            <p style="font-size:13.5px;margin:0;"><strong>Solution:</strong> Implemented a <strong>software hysteresis deadband</strong> (±50 ADC counts). Once the relay turns ON (at <code>threshold - 50</code>), it will not turn OFF until light exceeds <code>threshold + 50</code>, eliminating erratic oscillations.</p>
          </div>

          <div class="tech-card" style="border-left:4px solid #dd6b20;">
            <h5 style="color:#dd6b20;font-weight:700;">Issue 2: ESP32 Memory Depletion During High-Frequency Cloud Logging</h5>
            <p style="font-size:13.5px;margin:6px 0;"><strong>Symptom:</strong> Pushing historical telemetry records at 1-second intervals quickly exhausted the ESP32 heap memory, causing Wi-Fi SSL buffer overflow and system panic restarts after 15 minutes of operation.</p>
            <p style="font-size:13.5px;margin:0;"><strong>Solution:</strong> Decoupled telemetry polling from database archiving. Telemetry is read every 5 seconds, but historical logging to <code>/history</code> occurs every 15 seconds. Configured SSL buffer sizes with <code>fbdo.setBSSLBufferSize(1024, 1024)</code> to ensure rock-solid stability.</p>
          </div>

          <div class="tech-card" style="border-left:4px solid #3182ce;">
            <h5 style="color:#3182ce;font-weight:700;">Issue 3: Inverted Active-LOW Relay Logic Confusion</h5>
            <p style="font-size:13.5px;margin:6px 0;"><strong>Symptom:</strong> Sending <code>HIGH</code> turned the bulb OFF and <code>LOW</code> turned it ON, causing UI toggle states to appear reversed on the web dashboard.</p>
            <p style="font-size:13.5px;margin:0;"><strong>Solution:</strong> Formally defined hardware macro constants: <code>#define RELAY_ON LOW</code> and <code>#define RELAY_OFF HIGH</code>. Aligned the Firebase Boolean property <code>/environment/relayState</code> so <code>true</code> represents physically energized, regardless of micro-level pin inversion.</p>
          </div>

          <div class="tech-card" style="border-left:4px solid #38a169;">
            <h5 style="color:#38a169;font-weight:700;">Issue 4: Browser Freezing During Large Historical CSV Exports</h5>
            <p style="font-size:13.5px;margin:6px 0;"><strong>Symptom:</strong> Exporting tens of thousands of history nodes froze the browser UI thread while concatenating string arrays.</p>
            <p style="font-size:13.5px;margin:0;"><strong>Solution:</strong> Streamlined the export logic by iterating directly through child snapshots into an array buffer, generating a single UTF-8 encoded Blob, and immediately freeing references using <code>URL.revokeObjectURL()</code>.</p>
          </div>
        </div>

              <li><strong>Relative Timestamping:</strong> Relies on <code>millis() / 1000</code> for timestamps, which resets upon microcontroller reboot rather than tracking synchronized wall-clock UTC time.</li>
              <li><strong>DHT11 Sampling Speed:</strong> The DHT11 has a 1 Hz maximum sampling frequency and ±2°C accuracy, making it unsuitable for precision HVAC or laboratory thermal management.</li>
              <li><strong>Single-Phase Actuation:</strong> The 1-channel relay only controls one appliance; multi-room or multi-speed loads cannot be regulated.</li>
              <li><strong>Spark Plan Quotas:</strong> Firebase Realtime Database free tier limits simultaneous connections to 100 and storage to 1 GB.</li>
