    <article class="iot-document" data-task="task-1">
      <div class="badge-row">
        <span class="badge badge-green">Protosem IoT — Assignment 1</span>

      <h3>Task 1 – ESP32 Web Server LED Control</h3>
      
      <div class="iot-block">
        <h4>1. Project Overview &amp; Objective</h4>
        <p>The primary objective of Assignment 1 was to design and deploy a standalone local IoT web server running entirely on an <strong>ESP32 microcontroller</strong>. The system hosts an interactive, responsive web page that allows any authorized client device connected to the same Wi-Fi network (such as a laptop, tablet, or smartphone) to remotely monitor and control an LED in real time through an HTTP browser interface.</p>
        <p>Unlike cloud-dependent architectures that require third-party brokers or external internet gateways, this implementation operates directly on local area network (LAN) sockets over TCP Port 80, demonstrating core principles of embedded networking and device control.</p>
      </div>

      <div class="iot-block">
        <h4>2. Hardware Components &amp; Specifications</h4>
        <div class="spec-table-wrap">
          <table class="spec-table">
            <thead>
              <tr>
                <th>Component</th>
                <th>Specification / Part</th>
                <th>Quantity</th>

              </tr>
              <tr>
                <td><strong>Breadboard &amp; Jumpers</strong></td>
                <td>Half-size 400-point solderless breadboard + M-to-M wires</td>
                <td>1 set</td>
                <td>Rapid prototyping and circuit interconnection</td>
              </tr>
              <tr>
                <td><strong>USB Cable &amp; Host PC</strong></td>
                <td>Micro-USB data cable (5V / 1A power supply)</td>
                <td>1</td>
                <td>Firmware flashing via Arduino IDE &amp; Serial Monitor debugging</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="iot-block">
        <h4>3. Circuit Design &amp; Pinout Configuration</h4>
        <p>The hardware interface connects an LED to digital output pin <strong>GPIO 2</strong> (which also maps to the onboard LED on most ESP32 DevKit modules). The cathode of the LED is connected to the common Ground (GND) through the 220 &Omega; resistor.</p>
        <div class="diagram-box">
+-----------------------------------------------------------------------+
|                         ESP32 DEVELOPMENT BOARD                       |
|                                                                       |
|   [ GPIO 2 ] ─────────[ 220 &Omega; Resistor ]─────────(+) [ Anode ]       |
|                                                      LED (5mm)        |
|   [  GND   ] <─────────────────────────────────(-) [ Cathode ]     |
|                                                                       |
|   [ Micro-USB ] <══════ 5V DC Power &amp; Serial Communication (PC)      |
+-----------------------------------------------------------------------+
        </div>
        <p><strong>Current Calculation:</strong> With an ESP32 logic HIGH output of 3.3V and an LED forward voltage of 2.0V: <br>
        <code>I = (Vcc - Vf) / R = (3.3V - 2.0V) / 220 &Omega; &approx; 5.9 mA</code>. This safely protects the ESP32 GPIO pin, whose rated maximum current limit is 12-20mA.</p>
      </div>

      <div class="iot-block">
        <h4>4. System Architecture &amp; Communication Flow</h4>
        <p>The end-to-end communication follows a client-server architecture over standard HTTP/1.1:</p>
        <div class="diagram-box">
[ User Device / Browser ]
         │
         │ 1. HTTP GET Request: "GET /LED=ON HTTP/1.1"
         ▼
[ Wi-Fi Router / Local Subnet (2.4 GHz) ]
         │
         │ 2. Delivers packet to Port 80
         ▼
[ ESP32 Web Server (WiFiServer server(80)) ]
         ├──> 3. Reads ASCII header buffer
         ├──> 4. Detects command ("/LED=ON" or "/LED=OFF")
         ├──> 5. Executes digitalWrite(GPIO_2, HIGH / LOW)
         │
         │ 6. Generates HTTP 200 OK + Responsive HTML/CSS UI
         ▼
[ User Device / Browser ]
         │
         └──> 7. Renders refreshed interface displaying updated "LED IS ON" state
        </div>
      </div>

      <div class="iot-block">
        <h4>5. Complete Arduino C++ Source Code</h4>
        <p>The firmware below was developed and compiled in Arduino IDE using the official Espressif ESP32 board package:</p>
        <div class="code-wrapper">
          <div class="code-header">
            <span>ESP32_WebServer_LED_Control.ino</span>
            <span>C++ / Arduino</span>
          </div>
          <pre><code>#include &lt;WiFi.h&gt;

// --- Wi-Fi Network Credentials ---
const char* ssid     = "YOUR_WIFI_SSID";
const char* password = "YOUR_WIFI_PASSWORD";

// --- Hardware Pin Definitions ---
const int ledPin = 2; // Output pin connected to LED (or onboard LED)

// --- Initialize Web Server on Port 80 ---
WiFiServer server(80);

// --- Variable to store incoming HTTP request ---
String header;
String ledState = "off";

// --- Timer for client timeout ---
unsigned long currentTime = millis();
unsigned long previousTime = 0;
const long timeoutTime = 2000;

void setup() {
  Serial.begin(115200);
  pinMode(ledPin, OUTPUT);
  digitalWrite(ledPin, LOW); // Default state: OFF

  // Connect to Local Wi-Fi Network
  Serial.print("Connecting to Wi-Fi network: ");
  Serial.println(ssid);
  WiFi.begin(ssid, password);

  while (WiFi.status() != WL_CONNECTED) {
    delay(500);
    Serial.print(".");
  }

  // Print connection summary to Serial Monitor
  Serial.println("\n--- Wi-Fi Connection Established ---");
  Serial.print("Assigned ESP32 IP Address: http://");
  Serial.println(WiFi.localIP());

  // Start the HTTP server
  server.begin();
  Serial.println("HTTP Web Server successfully started on port 80.");
}

void loop() {
  WiFiClient client = server.available(); // Check for incoming client

  if (client) {
    currentTime = millis();
    previousTime = currentTime;
    Serial.println("\n[Client Connected]");
    String currentLine = "";

    while (client.connected() && currentTime - previousTime <= timeoutTime) {
      currentTime = millis();
      if (client.available()) {
        char c = client.read();
        header += c;

        if (c == '\n') {
          // If the line is empty, two newline characters indicate end of HTTP header
          if (currentLine.length() == 0) {
            // Send standard HTTP response status and headers
            client.println("HTTP/1.1 200 OK");
            client.println("Content-type:text/html");
            client.println("Connection: close");
            client.println();

            // Process user action commands from GET request
            if (header.indexOf("GET /LED=ON") >= 0) {
              Serial.println("Action: Turn LED ON (GPIO 2 -> HIGH)");
              ledState = "on";
              digitalWrite(ledPin, HIGH);
            } else if (header.indexOf("GET /LED=OFF") >= 0) {
              Serial.println("Action: Turn LED OFF (GPIO 2 -> LOW)");
              ledState = "off";
              digitalWrite(ledPin, LOW);
            }

            // Render responsive HTML/CSS web interface
            client.println("&lt;!DOCTYPE html&gt;&lt;html lang='en'&gt;");
            client.println("&lt;head&gt;&lt;meta name='viewport' content='width=device-width, initial-scale=1'&gt;");
            client.println("&lt;title&gt;ESP32 Web Server Control&lt;/title&gt;");
            client.println("&lt;style&gt;");
            client.println("body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f7f5ef; color: #202522; text-align: center; margin: 0; padding: 40px 16px; }");
            client.println(".card { background: #ffffff; max-width: 440px; margin: 0 auto; padding: 32px 24px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); border: 1px solid #dfe3db; }");
            client.println("h2 { margin: 0 0 10px; color: #1e6b52; font-size: 26px; }");
            client.println("p { color: #68716c; font-size: 15px; margin-bottom: 24px; }");
            client.println(".status { display: inline-block; padding: 6px 14px; border-radius: 999px; font-weight: 700; font-size: 13px; text-transform: uppercase; margin-bottom: 24px; }");
            client.println(".status-on { background: #e6f3ee; color: #1e6b52; }");
            client.println(".status-off { background: #fdf0e9; color: #e47e43; }");
            client.println(".btn { display: block; width: 100%; max-width: 240px; margin: 10px auto; padding: 14px 20px; font-size: 16px; font-weight: 700; text-decoration: none; border-radius: 8px; transition: .2s; }");
            client.println(".btn-on { background: #1e6b52; color: #ffffff; }");
            client.println(".btn-off { background: #e47e43; color: #ffffff; }");
            client.println("&lt;/style&gt;&lt;/head&gt;");
            client.println("&lt;body&gt;");
            client.println("&lt;div class='card'&gt;");
            client.println("&lt;h2&gt;ESP32 LED Web Server&lt;/h2&gt;");
            client.println("&lt;p&gt;Protosem Assignment 1 Local Control&lt;/p&gt;");
            if (ledState == "on") {
              client.println("&lt;div class='status status-on'&gt;Current State: LED is ON&lt;/div&gt;");
              client.println("&lt;a href='/LED=OFF' class='btn btn-off'&gt;TURN OFF&lt;/a&gt;");
            } else {
              client.println("&lt;div class='status status-off'&gt;Current State: LED is OFF&lt;/div&gt;");
              client.println("&lt;a href='/LED=ON' class='btn btn-on'&gt;TURN ON&lt;/a&gt;");
            }
            client.println("&lt;/div&gt;&lt;/body&gt;&lt;/html&gt;");
            client.println();
            break;
          } else {
            currentLine = "";
          }
        } else if (c != '\r') {
          currentLine += c;
        }
      }
    }
    // Clear header string for the next transaction
    header = "";
    // Terminate socket connection
    client.stop();
    Serial.println("[Client Disconnected]");
  }
}</code></pre>

          <li><strong>Hardware Protection:</strong> Sized current-limiting resistors accurately based on forward diode voltage drop and microcontroller pin drive limits.</li>

            <h5>Persistent Sockets vs Recurring Polling</h5>
            <p>Unlike HTTP where the client repeatedly queries the server, MQTT opens a single, long-lived TCP connection. The cloud broker instantly pushes events to the device the millisecond they occur.</p>

            <h5>Battery &amp; CPU Efficiency</h5>

          <div class="concept-card">
            <h5>Quality of Service (QoS) Levels</h5>
            <p>MQTT supports three messaging reliability tiers: QoS 0 (at most once), QoS 1 (at least once with ACK), and QoS 2 (exactly once), providing granular reliability control.</p>

        <p>Below is the complete, production-tested firmware sketch used to connect the ESP32 to Adafruit IO over MQTT. Note: Personal credentials and passwords have been safely masked.</p>
        <div class="code-wrapper">

          <pre><code>#include &lt;WiFi.h&gt;
#include "Adafruit_MQTT.h"

// 1. NETWORK &amp; CLOUD BROKER CREDENTIALS (MASKED FOR SECURITY)

#define WLAN_SSID       "YOUR_WIFI_SSID"          // Local 2.4 GHz Wi-Fi SSID
#define WLAN_PASS       "YOUR_WIFI_PASSWORD"      // Wi-Fi Password

#define AIO_SERVER      "io.adafruit.com"         // Adafruit IO MQTT Broker Host
#define AIO_SERVERPORT  1883                      // Standard unencrypted MQTT port
#define AIO_USERNAME    "YOUR_ADAFRUIT_USERNAME"  // Adafruit IO Account Username
#define AIO_KEY         "YOUR_AIO_KEY"            // 32-character active AIO Key

// ====================================================================
// 2. HARDWARE PIN DEFINITION
// ====================================================================
const int LED_PIN = 2; // Output pin: GPIO 2 (onboard LED or relay trigger)

// ====================================================================
// 3. MQTT CLIENT &amp; SUBSCRIPTION INSTANTIATION
// ====================================================================
WiFiClient client;
Adafruit_MQTT_Client mqtt(&amp;client, AIO_SERVER, AIO_SERVERPORT, AIO_USERNAME, AIO_KEY);

// Setup MQTT subscription for the feed: &lt;username&gt;/feeds/led
Adafruit_MQTT_Subscribe ledFeed = Adafruit_MQTT_Subscribe(&amp;mqtt, AIO_USERNAME "/feeds/led");

// Function prototype for auto-reconnection
void MQTT_connect();

// ====================================================================
// 4. SETUP ROUTINE
// ====================================================================
void setup() {
  Serial.begin(115200);
  delay(10);

  pinMode(LED_PIN, OUTPUT);
  digitalWrite(LED_PIN, LOW); // Default state: OFF

  Serial.println("\n--- ESP32 + Adafruit IO Cloud LED Control Initializing ---");

  // Connect to Wi-Fi
  Serial.print("Connecting to Wi-Fi: ");
  Serial.println(WLAN_SSID);
  WiFi.begin(WLAN_SSID, WLAN_PASS);

  while (WiFi.status() != WL_CONNECTED) {
    delay(500);
    Serial.print(".");
  }

  Serial.println("\nWiFi Connected successfully!");
  Serial.print("Assigned IP Address: ");
  Serial.println(WiFi.localIP());

  // Register MQTT Subscriptions
  mqtt.subscribe(&amp;ledFeed);
  Serial.println("Subscribed to MQTT Feed: " AIO_USERNAME "/feeds/led");
}

// ====================================================================
// 5. MAIN EXECUTION LOOP
// ====================================================================
void loop() {
  // Ensure the MQTT connection to broker remains active
  MQTT_connect();

  // Read subscription packets with a 5000ms non-blocking timeout
  Adafruit_MQTT_Subscribe *subscription;
  while ((subscription = mqtt.readSubscription(5000))) {
    if (subscription == &amp;ledFeed) {
      char *payload = (char *)ledFeed.lastread;
      Serial.print("\n[MQTT Update] Received on feed 'led': ");
      Serial.println(payload);

      // Evaluate received payload command
      if (strcasecmp(payload, "ON") == 0 || strcmp(payload, "1") == 0) {
        digitalWrite(LED_PIN, HIGH);
        Serial.println("-> Action: LED / Relay switched ON (GPIO 2 HIGH)");
      } else if (strcasecmp(payload, "OFF") == 0 || strcmp(payload, "0") == 0) {
        digitalWrite(LED_PIN, LOW);
        Serial.println("-> Action: LED / Relay switched OFF (GPIO 2 LOW)");
      } else {
        Serial.print("-> Warning: Unrecognized payload: ");
        Serial.println(payload);
      }
    }
  }

  // Ping the broker every 60s to maintain socket keep-alive
  if (!mqtt.ping()) {
    mqtt.disconnect();
  }
}

// ====================================================================
// 6. ROBUST MQTT AUTO-RECONNECT LOGIC
// ====================================================================
void MQTT_connect() {
  int8_t ret;

  // Stop if already connected
  if (mqtt.connected()) {
    return;
  }

  Serial.print("Connecting to Adafruit IO MQTT Broker... ");

  uint8_t retries = 3;
  while ((ret = mqtt.connect()) != 0) { // connect returns 0 on success
    Serial.println(mqtt.connectErrorString(ret));
    Serial.println("Retrying MQTT connection in 5 seconds...");
    mqtt.disconnect();
    delay(5000); // Wait 5 seconds before retrying
    retries--;
    if (retries == 0) {
      Serial.println("Failed to connect after 3 attempts. Resetting wait cycle...");
      return;
    }
  }

  Serial.println("Adafruit IO Connected!");
}</code></pre>

          <li><strong>Non-Blocking Event Listening:</strong> Inside <code>loop()</code>, <code>mqtt.readSubscription(5000)</code> listens for incoming MQTT publish packets. Instead of blocking the processor forever, it checks for available packets within a 5-second window, enabling other sensor or task routines to execute smoothly.</li>
          <li><strong>Case-Insensitive String Comparison:</strong> Using <code>strcasecmp(payload, "ON") == 0</code> ensures that whether Adafruit IO publishes <code>"ON"</code>, <code>"on"</code>, or <code>"1"</code>, the logic reliably turns the pin HIGH.</li>
          <li><strong>Heartbeat Keep-Alive:</strong> <code>mqtt.ping()</code> sends a lightweight ping packet to <code>io.adafruit.com</code> every 60 seconds. Without this ping, the cloud broker automatically drops idle TCP sockets after 90–120 seconds.</li>
          <li><strong>Auto-Reconnection Routine (<code>MQTT_connect</code>):</strong> If the Wi-Fi router experiences jitter or the broker temporarily restarts, this function detects the dropped socket and safely reconnects with a 3-attempt backoff loop.</li>

      <div class="iot-block">

function renderTask() {
  const params = new URLSearchParams(window.location.search);
  const taskId = params.get('task') || 'task-1';
  const container = document.getElementById('task-detail');
  
  if (taskData[taskId]) {
    container.innerHTML = taskData[taskId];
    document.title = (taskId === 'task-1' ? 'Task 1 – ESP32 Web Server LED Control' :
                      taskId === 'task-2' ? 'Task 2 – Cloud-Connected IoT LED Control via MQTT & Adafruit IO' :
                      taskId === 'task-3' ? 'Task 3 – Voice-Controlled Bulb' :
                      taskId === 'task-4' ? 'Task 4 – Firebase IoT Environment Monitoring' :
                      taskId === 'task-5' ? 'Task 5 – Home Automation' : 'Task Details') + ' | Santhosh P';
  } else {
    container.innerHTML = '<article class="iot-document"><h3>Task Not Found</h3><p>The requested task ID (' + taskId + ') does not exist.</p><p><a class="back-link" href="task-detail.html?task=task-1">← Return to Task 1</a></p></article>';
  }

  // Highlight active tab
  document.querySelectorAll('.task-nav-tab').forEach((tab) => {
    if (tab.id === 'tab-' + taskId) {
      tab.classList.add('active');
    } else {
      tab.classList.remove('active');
    }
  });
}

// Render on load and on popstate navigation
window.addEventListener('DOMContentLoaded', renderTask);
